aid: jsonapi

name: Json API APP

image: https://www.jsonapi.co/assets/open-graph.png

description: 'Json API APP is a marketplace where developers can monetize their APIs, logical components, microservices, and systems with zero commission. It offers a curated catalog of public APIs, databases, queues, servers, webhooks, and tools. The platform is invite‑only, providing a space for developers to sell, buy, and discover high‑quality APIs and components, aiming to reduce time‑to‑market and improve product ROI. It also hosts blogs, podcasts, and community resources for developers.'

